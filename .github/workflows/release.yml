name: Release

on:
  push:
    branches: [main]
  release:
    types: [published]

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - run: bun install --frozen-lockfile

      - run: bun run lint

  release:
    if: github.event_name == 'release' && github.event.action == 'published'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - run: bun run build

      - name: Prepare release asset and checksums
        run: |
          mkdir -p release
          cp dist/albus release/albus-darwin-arm64
          chmod +x release/albus-darwin-arm64
          cd release
          shasum -a 256 albus-darwin-arm64 > SHA256SUMS

      - name: Attach binary and checksums to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            release/albus-darwin-arm64
            release/SHA256SUMS

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@jeroeng/albus@$VERSION" version >/dev/null 2>&1; then
            echo "@jeroeng/albus@$VERSION is already published; skipping."
          else
            npm publish --access public --provenance
          fi

  publish-dev:
    if: github.ref == 'refs/heads/main'
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - name: Set unique dev version
        run: |
          BASE_VERSION=$(node -p "require('./package.json').version")
          DEV_VERSION="${BASE_VERSION}-dev.$(git rev-parse --short=7 HEAD).${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}"
          npm pkg set "version=${DEV_VERSION}"
          echo "Publishing ${DEV_VERSION} on the dev dist-tag."

      - name: Publish dev version to npm
        run: npm publish --tag dev --provenance
