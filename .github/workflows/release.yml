name: Release

on:
  push:
    tags:

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: bun install --frozen-lockfile

      - run: bun run lint

      - run: bun run build

      - name: Prepare release asset and checksums
        run: |
          mkdir -p release
          cp dist/albus release/albus-darwin-arm64
          chmod +x release/albus-darwin-arm64
          cd release
          shasum -a 256 albus-darwin-arm64 > SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/albus-darwin-arm64
            release/SHA256SUMS
          generate_release_notes: true

      - name: Publish to npm
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if npm view "@jeroeng/albus@$VERSION" version >/dev/null 2>&1; then
            echo "@jeroeng/albus@$VERSION is already published; skipping."
          else
            npm publish --access public --provenance
          fi
